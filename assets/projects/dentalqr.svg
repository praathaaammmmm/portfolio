<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" fill="none">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b35"/>
      <stop offset="1" stop-color="#0e2a4d"/>
    </linearGradient>
    <radialGradient id="dGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f35e9b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f35e9b" stop-opacity="0"/>
    </radialGradient>
    <filter id="dSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="720" height="900" fill="url(#dBg)"/>
  <circle cx="360" cy="340" r="260" fill="url(#dGlow)" filter="url(#dSoft)"/>

  <!-- large asymmetric QR composition, offset toward upper-right -->
  <g transform="translate(230,120)">
    <rect x="0" y="0" width="330" height="330" rx="14" fill="none" stroke="#f35e9b" stroke-width="2" opacity="0.55"/>

    <!-- finder patterns -->
    <g fill="#f35e9b">
      <rect x="24" y="24" width="72" height="72" opacity="0.9"/>
      <rect x="234" y="24" width="72" height="72" opacity="0.9"/>
      <rect x="24" y="234" width="72" height="72" opacity="0.9"/>
    </g>
    <g fill="#071b35">
      <rect x="40" y="40" width="40" height="40"/>
      <rect x="250" y="40" width="40" height="40"/>
      <rect x="40" y="250" width="40" height="40"/>
    </g>
    <g fill="#ff9bb8">
      <rect x="54" y="54" width="12" height="12"/>
      <rect x="264" y="54" width="12" height="12"/>
      <rect x="54" y="264" width="12" height="12"/>
    </g>

    <!-- data modules: irregular scatter reading as real QR data -->
    <g fill="#fff0c9" opacity="0.85">
      <rect x="130" y="30" width="16" height="16"/>
      <rect x="160" y="30" width="16" height="16"/>
      <rect x="130" y="60" width="16" height="16"/>
      <rect x="190" y="60" width="16" height="16"/>
      <rect x="130" y="90" width="16" height="16"/>
      <rect x="160" y="120" width="16" height="16"/>
      <rect x="190" y="150" width="16" height="16"/>
      <rect x="130" y="150" width="16" height="16"/>
      <rect x="220" y="120" width="16" height="16"/>
      <rect x="130" y="180" width="16" height="16"/>
      <rect x="160" y="200" width="16" height="16"/>
      <rect x="200" y="200" width="16" height="16"/>
      <rect x="240" y="180" width="16" height="16"/>
      <rect x="270" y="150" width="16" height="16"/>
      <rect x="150" y="250" width="16" height="16"/>
      <rect x="190" y="270" width="16" height="16"/>
      <rect x="230" y="250" width="16" height="16"/>
      <rect x="270" y="230" width="16" height="16"/>
      <rect x="270" y="270" width="16" height="16"/>
    </g>
  </g>

  <!-- clinic / tooth motif, anchored lower-left for asymmetry -->
  <g transform="translate(90,600)" stroke="#ff9bb8" stroke-width="2.4" fill="none" opacity="0.8">
    <path d="M40 10 C10 10 0 40 6 70 C10 96 22 110 30 140 C34 156 46 156 50 140 C56 116 58 100 66 100 C74 100 76 116 82 140 C86 156 98 156 102 140 C110 110 122 96 126 70 C132 40 122 10 92 10 C78 10 74 20 66 20 C58 20 54 10 40 10 Z"/>
  </g>
  <g fill="#f35e9b" opacity="0.6">
    <circle cx="120" cy="700" r="4"/>
    <circle cx="180" cy="760" r="3"/>
  </g>

  <!-- scan-line sweep detail -->
  <line x1="230" y1="480" x2="560" y2="480" stroke="#f35e9b" stroke-width="2" opacity="0.5"/>
  <line x1="230" y1="480" x2="230" y2="120" stroke="#f35e9b" stroke-width="1" opacity="0.25" stroke-dasharray="4 8"/>

  <g font-family="monospace" font-size="13" fill="#ff9bb8" opacity="0.75" letter-spacing="0.5">
    <text x="90" y="580">CLINIC INTAKE</text>
    <text x="230" y="500">SCAN COMPLETE</text>
  </g>
  <text x="40" y="850" font-family="monospace" font-size="14" fill="#fff0c9" opacity="0.5">$ dentalqr --scan patient_id --clinic 04</text>
</svg>
